openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: Islamic Research & Learning OS API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: auth
    description: Authentication
  - name: users
    description: User management
  - name: quran
    description: Quran reader and search
  - name: hadith
    description: Hadith search and filtering
  - name: books
    description: Islamic books library
  - name: learning
    description: Learning paths and lessons
  - name: notes
    description: User notes
  - name: bookmarks
    description: User bookmarks
  - name: folders
    description: User folders/collections
  - name: progress
    description: User progress tracking
  - name: admin
    description: Admin content management

paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  # ── Auth ──────────────────────────────────────────────────────────────────
  /auth/register:
    post:
      operationId: register
      tags: [auth]
      summary: Register a new user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
      responses:
        "201":
          description: Registered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "409":
          description: Email already in use
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/login:
    post:
      operationId: login
      tags: [auth]
      summary: Login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Logged in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "401":
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/logout:
    post:
      operationId: logout
      tags: [auth]
      summary: Logout
      responses:
        "200":
          description: Logged out
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"

  /auth/me:
    get:
      operationId: getMe
      tags: [auth]
      summary: Get current user
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  # ── Users ─────────────────────────────────────────────────────────────────
  /users/profile:
    patch:
      operationId: updateProfile
      tags: [users]
      summary: Update user profile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateProfileRequest"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"

  /users/stats:
    get:
      operationId: getUserStats
      tags: [users]
      summary: Get user study statistics
      responses:
        "200":
          description: User stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserStats"

  # ── Quran ─────────────────────────────────────────────────────────────────
  /quran/surahs:
    get:
      operationId: getSurahs
      tags: [quran]
      summary: Get list of all surahs
      responses:
        "200":
          description: List of surahs
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Surah"

  /quran/surahs/{surahNumber}:
    get:
      operationId: getSurah
      tags: [quran]
      summary: Get surah with ayahs
      parameters:
        - name: surahNumber
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Surah detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SurahDetail"

  /quran/ayahs/{surahNumber}/{ayahNumber}:
    get:
      operationId: getAyah
      tags: [quran]
      summary: Get single ayah with tafsir
      parameters:
        - name: surahNumber
          in: path
          required: true
          schema:
            type: integer
        - name: ayahNumber
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Ayah with tafsir
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AyahDetail"

  /quran/search:
    get:
      operationId: searchQuran
      tags: [quran]
      summary: Search Quran text
      parameters:
        - name: q
          in: query
          required: true
          schema:
            type: string
        - name: lang
          in: query
          schema:
            type: string
            enum: [ar, en, ur]
            default: en
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
      responses:
        "200":
          description: Search results
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QuranSearchResults"

  /quran/juz/{juzNumber}:
    get:
      operationId: getJuz
      tags: [quran]
      summary: Get ayahs by juz
      parameters:
        - name: juzNumber
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Juz ayahs
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Ayah"

  # ── Hadith ────────────────────────────────────────────────────────────────
  /hadith/collections:
    get:
      operationId: getHadithCollections
      tags: [hadith]
      summary: Get all hadith collections
      responses:
        "200":
          description: Collections
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/HadithCollection"

  /hadith/collections/{collectionId}/books:
    get:
      operationId: getHadithBooks
      tags: [hadith]
      summary: Get books in a hadith collection
      parameters:
        - name: collectionId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Books
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/HadithBook"

  /hadith/collections/{collectionId}/books/{bookNumber}/hadiths:
    get:
      operationId: getHadiths
      tags: [hadith]
      summary: Get hadiths in a book
      parameters:
        - name: collectionId
          in: path
          required: true
          schema:
            type: string
        - name: bookNumber
          in: path
          required: true
          schema:
            type: integer
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
      responses:
        "200":
          description: Hadiths
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HadithList"

  /hadith/{id}:
    get:
      operationId: getHadith
      tags: [hadith]
      summary: Get single hadith
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Hadith
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Hadith"

  /hadith/search:
    get:
      operationId: searchHadith
      tags: [hadith]
      summary: Search hadith
      parameters:
        - name: q
          in: query
          required: true
          schema:
            type: string
        - name: collectionId
          in: query
          schema:
            type: string
        - name: grade
          in: query
          schema:
            type: string
            enum: [sahih, hasan, daif, all]
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
      responses:
        "200":
          description: Search results
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HadithSearchResults"

  # ── Books ─────────────────────────────────────────────────────────────────
  /books:
    get:
      operationId: getBooks
      tags: [books]
      summary: Get books library
      parameters:
        - name: category
          in: query
          schema:
            type: string
        - name: language
          in: query
          schema:
            type: string
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
      responses:
        "200":
          description: Books
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BookList"

  /books/categories:
    get:
      operationId: getBookCategories
      tags: [books]
      summary: Get book categories
      responses:
        "200":
          description: Categories
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/BookCategory"

  /books/{bookId}:
    get:
      operationId: getBook
      tags: [books]
      summary: Get book detail
      parameters:
        - name: bookId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Book
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BookDetail"

  /books/{bookId}/chapters:
    get:
      operationId: getBookChapters
      tags: [books]
      summary: Get chapters of a book
      parameters:
        - name: bookId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Chapters
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/BookChapter"

  /books/{bookId}/chapters/{chapterId}:
    get:
      operationId: getBookChapter
      tags: [books]
      summary: Get chapter content
      parameters:
        - name: bookId
          in: path
          required: true
          schema:
            type: string
        - name: chapterId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Chapter content
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BookChapterDetail"

  /books/search:
    get:
      operationId: searchBooks
      tags: [books]
      summary: Search books
      parameters:
        - name: q
          in: query
          required: true
          schema:
            type: string
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
      responses:
        "200":
          description: Search results
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BookSearchResults"

  # ── Learning Paths ────────────────────────────────────────────────────────
  /learning/paths:
    get:
      operationId: getLearningPaths
      tags: [learning]
      summary: Get all learning paths
      parameters:
        - name: level
          in: query
          schema:
            type: string
            enum: [beginner, intermediate, advanced]
        - name: topic
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Learning paths
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/LearningPath"

  /learning/paths/{pathId}:
    get:
      operationId: getLearningPath
      tags: [learning]
      summary: Get learning path detail with lessons
      parameters:
        - name: pathId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Learning path
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LearningPathDetail"

  /learning/paths/{pathId}/enroll:
    post:
      operationId: enrollInPath
      tags: [learning]
      summary: Enroll in a learning path
      parameters:
        - name: pathId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Enrolled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Enrollment"

  /learning/paths/{pathId}/lessons/{lessonId}:
    get:
      operationId: getLesson
      tags: [learning]
      summary: Get lesson content
      parameters:
        - name: pathId
          in: path
          required: true
          schema:
            type: string
        - name: lessonId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Lesson
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Lesson"

  /learning/paths/{pathId}/lessons/{lessonId}/complete:
    post:
      operationId: completeLesson
      tags: [learning]
      summary: Mark lesson as complete
      parameters:
        - name: pathId
          in: path
          required: true
          schema:
            type: string
        - name: lessonId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Marked complete
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LessonProgress"

  /learning/my-paths:
    get:
      operationId: getMyEnrollments
      tags: [learning]
      summary: Get user's enrolled paths with progress
      responses:
        "200":
          description: Enrollments
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/EnrollmentWithProgress"

  # ── Notes ─────────────────────────────────────────────────────────────────
  /notes:
    get:
      operationId: getNotes
      tags: [notes]
      summary: Get user notes
      parameters:
        - name: folderId
          in: query
          schema:
            type: string
        - name: sourceType
          in: query
          schema:
            type: string
            enum: [quran, hadith, book, general]
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
      responses:
        "200":
          description: Notes
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NoteList"
    post:
      operationId: createNote
      tags: [notes]
      summary: Create a note
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateNoteRequest"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Note"

  /notes/{noteId}:
    get:
      operationId: getNote
      tags: [notes]
      summary: Get note
      parameters:
        - name: noteId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Note
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Note"
    patch:
      operationId: updateNote
      tags: [notes]
      summary: Update note
      parameters:
        - name: noteId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateNoteRequest"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Note"
    delete:
      operationId: deleteNote
      tags: [notes]
      summary: Delete note
      parameters:
        - name: noteId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"

  # ── Bookmarks ─────────────────────────────────────────────────────────────
  /bookmarks:
    get:
      operationId: getBookmarks
      tags: [bookmarks]
      summary: Get user bookmarks
      parameters:
        - name: sourceType
          in: query
          schema:
            type: string
            enum: [quran, hadith, book]
        - name: folderId
          in: query
          schema:
            type: string
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
      responses:
        "200":
          description: Bookmarks
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BookmarkList"
    post:
      operationId: createBookmark
      tags: [bookmarks]
      summary: Create a bookmark
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateBookmarkRequest"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Bookmark"

  /bookmarks/{bookmarkId}:
    delete:
      operationId: deleteBookmark
      tags: [bookmarks]
      summary: Delete bookmark
      parameters:
        - name: bookmarkId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"

  # ── Folders ───────────────────────────────────────────────────────────────
  /folders:
    get:
      operationId: getFolders
      tags: [folders]
      summary: Get user folders
      responses:
        "200":
          description: Folders
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Folder"
    post:
      operationId: createFolder
      tags: [folders]
      summary: Create folder
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateFolderRequest"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Folder"

  /folders/{folderId}:
    get:
      operationId: getFolder
      tags: [folders]
      summary: Get folder with contents
      parameters:
        - name: folderId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Folder
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FolderDetail"
    patch:
      operationId: updateFolder
      tags: [folders]
      summary: Update folder
      parameters:
        - name: folderId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateFolderRequest"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Folder"
    delete:
      operationId: deleteFolder
      tags: [folders]
      summary: Delete folder
      parameters:
        - name: folderId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"

  # ── Progress ──────────────────────────────────────────────────────────────
  /progress/dashboard:
    get:
      operationId: getProgressDashboard
      tags: [progress]
      summary: Get user progress dashboard
      responses:
        "200":
          description: Dashboard data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProgressDashboard"

  /progress/reading-streak:
    get:
      operationId: getReadingStreak
      tags: [progress]
      summary: Get user reading streak
      responses:
        "200":
          description: Streak info
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadingStreak"

  /progress/log:
    post:
      operationId: logReadingActivity
      tags: [progress]
      summary: Log a reading activity
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LogActivityRequest"
      responses:
        "200":
          description: Logged
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"

  # ── Admin ─────────────────────────────────────────────────────────────────
  /admin/stats:
    get:
      operationId: getAdminStats
      tags: [admin]
      summary: Get platform statistics
      responses:
        "200":
          description: Stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminStats"

  /admin/users:
    get:
      operationId: getAdminUsers
      tags: [admin]
      summary: List all users
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
        - name: search
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Users
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminUserList"

  /admin/books:
    post:
      operationId: adminCreateBook
      tags: [admin]
      summary: Create a book (admin)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminCreateBookRequest"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BookDetail"

  /admin/books/{bookId}:
    patch:
      operationId: adminUpdateBook
      tags: [admin]
      summary: Update a book (admin)
      parameters:
        - name: bookId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminUpdateBookRequest"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BookDetail"
    delete:
      operationId: adminDeleteBook
      tags: [admin]
      summary: Delete a book (admin)
      parameters:
        - name: bookId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"

  /admin/learning-paths:
    post:
      operationId: adminCreateLearningPath
      tags: [admin]
      summary: Create a learning path (admin)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminCreateLearningPathRequest"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LearningPathDetail"

  /admin/learning-paths/{pathId}:
    patch:
      operationId: adminUpdateLearningPath
      tags: [admin]
      summary: Update a learning path (admin)
      parameters:
        - name: pathId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminUpdateLearningPathRequest"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LearningPathDetail"

  /admin/content/seed:
    post:
      operationId: seedContent
      tags: [admin]
      summary: Seed initial Islamic content (admin)
      responses:
        "200":
          description: Seeded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required: [status]

    ErrorResponse:
