kind = "mobile"
previewPath = "/"
title = "Islamic Research & Learning OS"
version = "1.0.0"
id = "artifacts/islamic-app"
router = "expo-domain"

[[integratedSkills]]
name = "expo"
version = "1.0.0"

[[services]]
ensurePreviewReachable = "/status"
name = "expo"
paths = [ "/" ]
localPort = 18441

[services.development]
run = "pnpm --filter @workspace/islamic-app run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/islamic-app", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/islamic-app", "run", "serve" ]

[services.env]
PORT = "18441"
BASE_PATH = "/"
