<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient: Deep Spiritual Midnight Teal to Emerald -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#041B15" />
      <stop offset="50%" stop-color="#062F24" />
      <stop offset="100%" stop-color="#0A4636" />
    </linearGradient>

    <!-- Imperial Gold Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047" />
      <stop offset="35%" stop-color="#F59E0B" />
      <stop offset="70%" stop-color="#D97706" />
      <stop offset="100%" stop-color="#B45309" />
    </linearGradient>

    <!-- Emerald Leaf Left -->
    <linearGradient id="leafLeft" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>

    <!-- Emerald Leaf Right -->
    <linearGradient id="leafRight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>

    <!-- Inner Glow Filter -->
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Subtle Drop Shadow -->
    <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.45" />
    </filter>
  </defs>

  <!-- Squircle App Icon Container with Smooth Rounded Corners -->
  <rect width="512" height="512" rx="115" fill="url(#bgGrad)" />

  <!-- Outer Concentric Subtle Astrolabe / Sacred Geometry Rings -->
  <circle cx="256" cy="256" r="218" fill="none" stroke="#F59E0B" stroke-width="1.2" stroke-opacity="0.18" stroke-dasharray="6 8" />
  <circle cx="256" cy="256" r="192" fill="none" stroke="#34D399" stroke-width="1.5" stroke-opacity="0.15" />
  <circle cx="256" cy="256" r="168" fill="none" stroke="#F59E0B" stroke-width="1.0" stroke-opacity="0.22" />

  <!-- Sacred 8-Pointed Star Backdrop (Rub el Hizb) Micro-Accents -->
  <g transform="translate(256, 120) scale(0.65)" filter="url(#softGlow)">
    <polygon points="0,-36 10,-10 36,0 10,10 0,36 -10,10 -36,0 -10,-10" fill="url(#goldGrad)" opacity="0.95" />
    <polygon points="0,-36 10,-10 36,0 10,10 0,36 -10,10 -36,0 -10,-10" transform="rotate(45)" fill="url(#goldGrad)" opacity="0.8" />
    <circle cx="0" cy="0" r="8" fill="#FFF" />
  </g>

  <!-- Central Symbol Group: Unified Book + Qibla Compass Needle + Kaaba Gateway Arch -->
  <g filter="url(#dropShadow)">
    <!-- Left Book Page (Fluid Minimalist Arc of Knowledge) -->
    <path d="M 256 376 
             C 210 388, 140 376, 108 340 
             C 88 318, 92 230, 148 194 
             C 192 166, 236 190, 256 216 
             Z" 
          fill="url(#leafLeft)" opacity="0.95" />

    <!-- Right Book Page (Harmonious Symmetry) -->
    <path d="M 256 376 
             C 302 388, 372 376, 404 340 
             C 424 318, 420 230, 364 194 
             C 320 166, 276 190, 256 216 
             Z" 
          fill="url(#leafRight)" opacity="0.95" />

    <!-- Center Spine / Radiant Gold Quill & Compass Needle pointing upward toward Qibla / Truth -->
    <path d="M 256 128 
             L 274 246 
             L 256 394 
             L 238 246 
             Z" 
          fill="url(#goldGrad)" />

    <!-- Inner Core: Geometric Mihrab Arch / Open Portal of Divine Guidance -->
    <path d="M 226 364 
             C 226 294, 286 294, 286 364 
             L 256 384 
             Z" 
          fill="#041B15" opacity="0.85" />

    <!-- Kaaba Diamond Motif at Center Vertex -->
    <polygon points="256,220 270,240 256,260 242,240" fill="#FFF" opacity="0.95" />

    <!-- Delicate Gold Page Edge Highlights -->
    <path d="M 108 340 C 140 376, 210 388, 256 376" fill="none" stroke="url(#goldGrad)" stroke-width="4.5" stroke-linecap="round" />
    <path d="M 404 340 C 372 376, 302 388, 256 376" fill="none" stroke="url(#goldGrad)" stroke-width="4.5" stroke-linecap="round" />
  </g>

  <!-- Ambient Light Reflection Arc -->
  <path d="M 115 15 C 200 6, 312 6, 397 15 C 445 20, 485 52, 497 100 C 420 80, 280 85, 120 160 C 50 195, 30 150, 45 105 C 57 60, 85 22, 115 15 Z" fill="#FFFFFF" opacity="0.04" />
</svg>
